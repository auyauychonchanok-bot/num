<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ผจญภัยป่าเวทมนตร์ (Math Adventure)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Itim&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Itim', 'Fredoka', cursive, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Canvas Wrapper to keep aspect ratio fit */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Top HUD Header */
        #game-hud {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        .hud-left-group {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        #creator-logo {
            width: clamp(32px, 6vw, 42px);
            height: clamp(32px, 6vw, 42px);
            border-radius: 8px;
            border: 2px solid #ffe600;
            box-shadow: 0 0 8px #ffe600;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sound-toggle {
            width: clamp(32px, 6vw, 42px);
            height: clamp(32px, 6vw, 42px);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-size: clamp(14px, 3.5vw, 18px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hud-stats {
            display: flex;
            gap: 6px;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffe600;
            border-radius: 8px;
            padding: 4px 10px;
            color: #ffffff;
            font-size: clamp(0.75rem, 2vw, 1rem);
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 1px 1px 2px #000;
        }

        /* Question Banner */
        #question-panel {
            position: absolute;
            top: calc(env(safe-area-inset-top, 10px) + 45px);
            left: 50%;
            transform: translateX(-50%);
            width: min(92%, 600px);
            background: rgba(0, 10, 25, 0.92);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            padding: 8px 14px;
            color: #fff;
            text-align: center;
            z-index: 45;
            display: none;
            box-shadow: 0 4px 20px rgba(0,240,255,0.3);
        }

        #question-text {
            font-size: clamp(0.85rem, 2.5vw, 1.15rem);
            color: #ffffff;
            text-shadow: 1px 1px 3px #000;
            font-weight: 600;
        }

        /* Baskets Display */
        #baskets-overlay {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 10px) + 80px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 40;
            pointer-events: none;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 16px;
            border-radius: 20px;
        }

        .basket-item-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffe600;
            font-size: clamp(0.75rem, 2vw, 0.95rem);
            font-weight: bold;
        }

        /* Control UI Overlay */
        #ui-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
        }

        /* Action Buttons Area */
        .action-group {
            position: absolute;
            right: calc(env(safe-area-inset-right, 10px) + 10px);
            bottom: calc(env(safe-area-inset-bottom, 10px) + 10px);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }

        .button-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-action {
            padding: 8px 14px;
            font-size: clamp(0.75rem, 2vw, 0.95rem);
            font-family: 'Itim', cursive;
            color: #fff;
            background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%);
            border: 2px solid #fff;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            touch-action: manipulation;
            white-space: nowrap;
            font-weight: bold;
        }

        .btn-action:active { transform: scale(0.95); }

        .btn-flag {
            background: linear-gradient(180deg, #ff0055 0%, #ff5500 100%);
        }

        .choices-container {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.85);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .btn-choice {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #aaa;
            background: #222;
            color: #fff;
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-family: 'Itim', cursive;
            touch-action: manipulation;
        }

        .btn-choice.selected {
            background: #ffe600;
            color: #000;
            font-weight: bold;
        }

        /* Joystick Control Zone */
        #joystick-zone {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 45vw;
            height: 60vh;
            pointer-events: auto;
            z-index: 40;
        }

        #joystick-base {
            position: absolute;
            width: min(110px, 25vw);
            height: min(110px, 25vw);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            display: none;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 41;
        }

        #joystick-stick {
            position: absolute;
            width: 45%;
            height: 45%;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe600 0%, #ff9900 100%);
            border: 2px solid #fff;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Start Screen Overlay */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(0,0,0,0.85);
        }

        .screen.active { display: flex; }

        #start-screen {
            background: url('./a1.jpeg') no-repeat center center / cover;
            padding: 15px;
        }

        .start-card {
            background: rgba(0, 10, 20, 0.92);
            border: 2px solid #00f0ff;
            border-radius: 16px;
            padding: 20px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,240,255,0.4);
        }

        .game-title {
            font-size: clamp(1.4rem, 4.5vw, 2.2rem);
            color: #fff;
            text-shadow: 0 0 10px #ff007f;
            margin-bottom: 4px;
        }

        .game-subtitle {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            color: #ffe600;
            margin-bottom: 12px;
        }

        .rules-box {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            color: #eee;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            text-align: left;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .btn-start {
            padding: 8px 28px;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-family: 'Itim', cursive;
            color: #fff;
            background: linear-gradient(180deg, #ff9900 0%, #ff5500 100%);
            border: 2px solid #fff;
            border-radius: 40px;
            box-shadow: 0 0 12px #ff9900;
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Top Navigation HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-left-group">
            <div id="creator-logo">
                <img src="./a.png" alt="Logo" style="width:100%;height:100%;object-fit:cover;border-radius:6px;" onerror="this.style.display='none'">
            </div>
            <button id="sound-toggle">🔊</button>
        </div>
        <div class="hud-stats">
            <div class="hud-box" id="hud-level">ด่านที่: 1</div>
            <div class="hud-box" id="hud-timer">⏳ 02:00</div>
            <div class="hud-box" id="hud-lives">❤️❤️❤️</div>
        </div>
    </div>

    <!-- Question Box -->
    <div id="question-panel">
        <div id="question-text">โจทย์กำลังโหลด...</div>
    </div>

    <!-- Basket Indicator -->
    <div id="baskets-overlay" style="display: none;"></div>

    <!-- In-Game Controls -->
    <div id="ui-controls" style="display: none;">
        <div id="joystick-zone"></div>
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <div class="action-group">
            <div class="button-row">
                <div class="choices-container" id="choices-box"></div>
                <button class="btn-action btn-flag" id="btn-submit">ส่งตอบ 🚩</button>
            </div>
            <div class="button-row">
                <button class="btn-action" id="btn-put">ใส่ 🧺</button>
                <button class="btn-action" id="btn-take">หยิบ 🧺↩️</button>
                <button class="btn-action" id="btn-drop">วางลง 🍃</button>
            </div>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="screen active">
        <div class="start-card">
            <h1 class="game-title">ผจญภัยป่าเวทมนตร์</h1>
            <div class="game-subtitle">เกมนับจำนวนทีละ 2 และ 5</div>
            
            <div class="rules-box">
                📜 <b>วิธีเล่น (โหมด ROV Touch):</b><br>
                • แตะลากจอยสติ๊กฝั่งซ้ายเพื่อบังคับตัวละคร 360°<br>
                • เดินเก็บไอเทม แล้วนำไปใส่ในตะกร้าด้านบน<br>
                • เลือกคำตอบรวม แล้วกดปุ่มส่งตอบสีแดง 🚩
            </div>

            <button class="btn-start" onclick="startGame()">เริ่มเล่น 🎮</button>
        </div>
    </div>
</div>

<script>
    class SoundEngine {
        constructor() { this.ctx = null; this.muted = false; }
        init() {
            if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx.state === 'suspended') this.ctx.resume();
        }
        playTone(freq, type, duration) {
            if (this.muted || !this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch(e){}
        }
        playCorrect() { this.playTone(523.25, 'sine', 0.15); setTimeout(() => this.playTone(783.99, 'sine', 0.3), 150); }
        playWrong() { this.playTone(200, 'sawtooth', 0.2); }
    }

    const audio = new SoundEngine();
    document.getElementById('sound-toggle').addEventListener('click', () => {
        audio.init();
        audio.muted = !audio.muted;
        document.getElementById('sound-toggle').innerText = audio.muted ? '🔇' : '🔊';
    });

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const bgStart = new Image(); 
    bgStart.src = './a2.jpeg';

    let currentMode = 'START';
    let currentLevel = 1;
    let selectedCountChoice = null;

    // Fixed Virtual World Scale
    const WORLD_WIDTH = 1200;
    const WORLD_HEIGHT = 700;

    const player = {
        x: 200,
        y: 350,
        size: 50, // เพิ่มขนาดเพื่อให้เห็นชัด
        speed: 6,
        vx: 0,
        vy: 0,
        heldItem: null
    };

    const villain = {
        x: 600,
        y: 250,
        size: 50,
        active: true
    };

    const ITEM_EMOJI_POOL = [
        { emoji: '🍄', name: 'เห็ด' }, { emoji: '🍎', name: 'แอปเปิ้ล' },
        { emoji: '🥕', name: 'แครอท' }, { emoji: '🌽', name: 'ข้าวโพด' },
        { emoji: '🍓', name: 'สตรอว์เบอร์รี' }
    ];

    let currentQuestion = null;
    let itemsOnGround = [];
    let baskets = [];

    // Fit-to-screen scale calculator
    function updateCanvasSize() {
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        const scale = Math.min(windowWidth / WORLD_WIDTH, windowHeight / WORLD_HEIGHT);

        canvas.width = WORLD_WIDTH * scale;
        canvas.height = WORLD_HEIGHT * scale;

        // Auto scale internal rendering context
        ctx.scale(scale, scale);
    }

    window.addEventListener('resize', updateCanvasSize);
    updateCanvasSize();

    // Joystick Control Logic
    const joyZone = document.getElementById('joystick-zone');
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    let touchId = null;
    let joyCenter = { x: 0, y: 0 };

    joyZone.addEventListener('touchstart', (e) => {
        if (touchId !== null) return;
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        
        joyCenter = { x: touch.clientX, y: touch.clientY };
        joyBase.style.left = `${joyCenter.x}px`;
        joyBase.style.top = `${joyCenter.y}px`;
        joyBase.style.display = 'block';
        joyStick.style.transform = `translate(-50%, -50%)`;
    });

    window.addEventListener('touchmove', (e) => {
        if (touchId === null) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) {
                const touch = e.changedTouches[i];
                const dx = touch.clientX - joyCenter.x;
                const dy = touch.clientY - joyCenter.y;
                const dist = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);

                const maxR = joyBase.offsetWidth / 2;
                const moveDist = Math.min(dist, maxR);
                const stickX = Math.cos(angle) * moveDist;
                const stickY = Math.sin(angle) * moveDist;

                joyStick.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;

                const intensity = moveDist / maxR;
                player.vx = Math.cos(angle) * player.speed * intensity;
                player.vy = Math.sin(angle) * player.speed * intensity;
            }
        }
    });

    const resetJoystick = (e) => {
        if (touchId === null) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) {
                touchId = null;
                joyBase.style.display = 'none';
                player.vx = 0;
                player.vy = 0;
            }
        }
    };

    window.addEventListener('touchend', resetJoystick);
    window.addEventListener('touchcancel', resetJoystick);

    // Keyboard Fallback
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function startGame() {
        audio.init();
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('ui-controls').style.display = 'block';
        currentLevel = 1;
        enterLevel(currentLevel);
        requestAnimationFrame(gameLoop);
    }

    function enterLevel(levelNum) {
        currentLevel = levelNum;
        currentMode = 'GAME';
        document.getElementById('game-hud').style.display = 'flex';
        document.getElementById('hud-level').innerText = `ด่านที่: ${currentLevel}`;

        const countType = Math.random() > 0.5 ? 2 : 5;
        const basketCount = 3;
        const targetObj = ITEM_EMOJI_POOL[Math.floor(Math.random() * ITEM_EMOJI_POOL.length)];

        currentQuestion = {
            text: `เก็บ ${targetObj.name} ${targetObj.emoji} ใส่ตะกร้า ${basketCount} ใบ ใบละ ${countType} ชิ้น`,
            basketsNeeded: basketCount,
            perBasket: countType,
            totalTarget: basketCount * countType,
            targetEmoji: targetObj.emoji
        };

        document.getElementById('question-panel').style.display = 'block';
        document.getElementById('question-text').innerText = currentQuestion.text;

        const choicesBox = document.getElementById('choices-box');
        choicesBox.innerHTML = '';
        selectedCountChoice = null;
        [currentQuestion.totalTarget, currentQuestion.totalTarget + countType].sort(() => Math.random() - 0.5).forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = `รวม ${val}`;
            btn.onclick = () => {
                document.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedCountChoice = val;
            };
            choicesBox.appendChild(btn);
        });

        baskets = Array.from({ length: basketCount }, (_, i) => ({ id: i + 1, items: [] }));
        renderBasketsUI();

        itemsOnGround = [];
        for(let i=0; i < currentQuestion.totalTarget + 2; i++) {
            itemsOnGround.push({
                emoji: currentQuestion.targetEmoji,
                x: 100 + Math.random() * (WORLD_WIDTH - 200),
                y: 120 + Math.random() * (WORLD_HEIGHT - 240),
                size: 40 // ปรับขนาดไอเทมให้ใหญ่ขึ้น
            });
        }
    }

    function renderBasketsUI() {
        const overlay = document.getElementById('baskets-overlay');
        overlay.style.display = 'flex';
        overlay.innerHTML = '';
        baskets.forEach((b, idx) => {
            const bDiv = document.createElement('div');
            bDiv.className = 'basket-item-ui';
            bDiv.innerHTML = `<div>ใบที่ ${idx + 1} 🧺</div><div>${b.items.join('') || 'ว่าง'}</div>`;
            overlay.appendChild(bDiv);
        });
    }

    document.getElementById('btn-put').onclick = () => {
        if (!player.heldItem) return;
        for(let b of baskets) {
            if (b.items.length < currentQuestion.perBasket) {
                b.items.push(player.heldItem);
                player.heldItem = null;
                renderBasketsUI();
                return;
            }
        }
    };

    document.getElementById('btn-take').onclick = () => {
        if (player.heldItem) return;
        for (let i = baskets.length - 1; i >= 0; i--) {
            if (baskets[i].items.length > 0) {
                player.heldItem = baskets[i].items.pop();
                renderBasketsUI();
                return;
            }
        }
    };

    document.getElementById('btn-drop').onclick = () => player.heldItem = null;

    document.getElementById('btn-submit').onclick = () => {
        let total = baskets.reduce((sum, b) => sum + b.items.length, 0);
        if (total === currentQuestion.totalTarget && selectedCountChoice === currentQuestion.totalTarget) {
            audio.playCorrect();
            alert("✨ ถูกต้อง! ผ่านด่าน");
            enterLevel(currentLevel + 1);
        } else {
            audio.playWrong();
            alert("❌ ยังไม่ถูกต้อง ลองใหม่อีกครั้ง!");
        }
    };

    function updateMovement() {
        let kx = 0, ky = 0;
        if (keys['ArrowUp'] || keys['w']) ky -= player.speed;
        if (keys['ArrowDown'] || keys['s']) ky += player.speed;
        if (keys['ArrowLeft'] || keys['a']) kx -= player.speed;
        if (keys['ArrowRight'] || keys['d']) kx += player.speed;

        const mx = player.vx || kx;
        const my = player.vy || ky;

        player.x = Math.max(40, Math.min(WORLD_WIDTH - 40, player.x + mx));
        player.y = Math.max(40, Math.min(WORLD_HEIGHT - 40, player.y + my));

        // Auto Pick Item
        itemsOnGround.forEach((it, idx) => {
            if (!player.heldItem && Math.hypot(player.x - it.x, player.y - it.y) < player.size / 1.2) {
                player.heldItem = it.emoji;
                itemsOnGround.splice(idx, 1);
            }
        });
    }

    function render() {
        if (currentMode !== 'GAME') return;

        // Draw Map Background
        if (bgStart.complete && bgStart.naturalWidth !== 0) {
            ctx.drawImage(bgStart, 0, 0, WORLD_WIDTH, WORLD_HEIGHT);
        } else {
            ctx.fillStyle = '#0f291e';
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
        }

        // --- เพิ่มแผ่นกรองแสงเพื่อให้ตัวละครและไอเทมคมชัดมากยิ่งขึ้น ---
        ctx.fillStyle = 'rgba(0, 10, 5, 0.45)';
        ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        // Render Y-Sorting Depth System
        const renderList = [];
        itemsOnGround.forEach(it => renderList.push({ type: 'item', y: it.y, obj: it }));
        if (villain.active) renderList.push({ type: 'villain', y: villain.y, obj: villain });
        renderList.push({ type: 'player', y: player.y + 1000, obj: player });

        renderList.sort((a, b) => a.y - b.y);

        renderList.forEach(node => {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // เพิ่ม Stroke และ Shadow เพื่อให้ตัวละครแจ่มชัด
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 6;

            if (node.type === 'item') {
                ctx.font = `${node.obj.size}px serif`;
                ctx.fillText(node.obj.emoji, node.obj.x, node.obj.y);
            } else if (node.type === 'villain') {
                ctx.font = `${node.obj.size}px serif`;
                ctx.fillText('🦹', node.obj.x, node.obj.y);
            } else if (node.type === 'player') {
                ctx.font = `${node.obj.size}px serif`;
                ctx.fillText('👩‍🌾', node.obj.x, node.obj.y);

                if (node.obj.heldItem) {
                    ctx.font = '24px serif';
                    ctx.fillText(node.obj.heldItem, node.obj.x + 20, node.obj.y - 25);
                }
            }

            // Reset Shadow
            ctx.shadowBlur = 0;
        });
    }

    function gameLoop() {
        updateMovement();
        render();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
