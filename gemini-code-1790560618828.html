<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ผจญภัยป่าเวทมนตร์ (Math Adventure)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Itim&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1d13;
            font-family: 'Itim', 'Fredoka', cursive, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            margin: 0 auto;
            overflow: hidden;
            background: #0f2015;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* โลโก้ผู้สร้างรูปภาพ a.png ขนาด 40x40px อยู่มุมซ้ายบนทุกหน้า */
        #creator-logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            z-index: 100;
            border-radius: 8px;
            border: 2px solid #ffe600;
            box-shadow: 0 0 8px #ffe600;
            background: #222;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #creator-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .screen.active {
            display: flex;
        }

        #start-screen {
            background: url('./a1.jpeg') no-repeat center center / cover;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        #start-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .start-content {
            position: relative;
            z-index: 2;
        }

        .game-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #fff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .btn-start {
            padding: 12px 35px;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-family: 'Itim', cursive;
            color: #fff;
            background: linear-gradient(180deg, #ff9900 0%, #ff5500 100%);
            border: 3px solid #fff;
            border-radius: 50px;
            box-shadow: 0 0 15px #ff9900;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #game-hud {
            position: absolute;
            top: 10px;
            left: 60px;
            right: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            pointer-events: none;
            gap: 5px;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffe600;
            border-radius: 12px;
            padding: 4px 10px;
            color: #fff;
            font-size: clamp(0.85rem, 2.5vw, 1.2rem);
            text-shadow: 0 0 5px #ffe600;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        /* หลอดพลังชีวิตของด่านที่ 6 */
        #boss-hp-bar-container {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 60;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 15px;
            border-radius: 15px;
            border: 2px solid #ffe600;
        }

        .hp-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: clamp(0.85rem, 2.2vw, 1.1rem);
            font-weight: bold;
        }

        .hp-bar-bg {
            flex: 1;
            height: 16px;
            background: #333;
            border-radius: 10px;
            border: 1.5px solid #fff;
            overflow: hidden;
            position: relative;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
        }

        #player-hp-fill {
            background: linear-gradient(90deg, #00ff88, #00b359);
        }

        #villain-hp-fill {
            background: linear-gradient(90deg, #ff3300, #990000);
        }

        #question-panel {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 700px;
            background: rgba(0, 20, 40, 0.92);
            border: 2px solid #00f0ff;
            border-radius: 15px;
            padding: 8px 12px;
            color: #fff;
            text-align: center;
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            box-shadow: 0 0 15px #00f0ff;
            z-index: 50;
            display: none;
        }

        #baskets-overlay {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 60;
            pointer-events: none;
            justify-content: center;
            width: 90%;
        }

        .basket-item-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 4px #ffe600;
        }

        .basket-title {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #ffe600;
            font-weight: bold;
        }

        .basket-icon {
            font-size: clamp(2rem, 5vw, 2.8rem);
            line-height: 1;
        }

        .basket-contents {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            min-height: 24px;
            margin-top: -5px;
        }

        #bottom-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px;
            z-index: 50;
            pointer-events: none;
            box-sizing: border-box;
        }

        .action-group {
            display: flex;
            gap: 5px;
            pointer-events: auto;
            align-items: center;
            flex-wrap: wrap;
            max-width: 45%;
        }

        /* กลุ่มปุ่มยิงฝั่งซ้ายของจอ (เฉพาะด่าน 6) */
        #shoot-controls {
            position: absolute;
            left: 15px;
            bottom: 110px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 70;
            pointer-events: auto;
        }

        .btn-shoot {
            padding: 10px 16px;
            font-size: clamp(0.9rem, 2.2vw, 1.15rem);
            font-family: 'Itim', cursive;
            color: #fff;
            background: linear-gradient(180deg, #ff3300 0%, #990000 100%);
            border: 2px solid #ffe600;
            border-radius: 12px;
            box-shadow: 0 0 12px #ff3300;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-shoot:active {
            transform: scale(0.92);
            background: linear-gradient(180deg, #ff6600 0%, #cc0000 100%);
        }

        .btn-action {
            padding: 6px 10px;
            font-size: clamp(0.75rem, 2vw, 0.95rem);
            font-family: 'Itim', cursive;
            color: #fff;
            background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%);
            border: 2px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 8px #00c6ff;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-action:active {
            transform: scale(0.92);
        }

        .btn-take-basket {
            background: linear-gradient(180deg, #ff9900 0%, #e65c00 100%);
            box-shadow: 0 0 8px #ff9900;
        }

        .btn-flag {
            background: linear-gradient(180deg, #ff0055 0%, #ff5500 100%);
            color: #fff;
            font-weight: bold;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            padding: 4px 14px;
            border-color: #fff;
            box-shadow: 0 0 10px #ff0055;
        }

        .choices-container {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.8);
            padding: 4px;
            border-radius: 10px;
            border: 2px solid #fff;
        }

        .btn-choice {
            padding: 4px 8px;
            font-size: clamp(0.75rem, 2vw, 0.95rem);
            border-radius: 6px;
            border: 1px solid #aaa;
            background: #333;
            color: #fff;
            cursor: pointer;
            font-family: 'Itim', cursive;
        }

        .btn-choice.selected {
            background: #ffe600;
            color: #000;
            font-weight: bold;
            border-color: #fff;
            box-shadow: 0 0 8px #ffe600;
        }

        #dpad {
            display: grid;
            grid-template-columns: repeat(3, clamp(35px, 8vw, 45px));
            grid-template-rows: repeat(3, clamp(35px, 8vw, 45px));
            gap: 2px;
            pointer-events: auto;
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
        }

        .dbtn {
            background: rgba(255,255,255,0.25);
            border: 1px solid #fff;
            border-radius: 8px;
            color: #fff;
            font-size: clamp(12px, 3vw, 18px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .dbtn:active {
            background: #ffe600;
            color: #000;
        }

        #result-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 30, 0.95);
            border: 3px solid #ffe600;
            border-radius: 20px;
            padding: 20px 25px;
            text-align: center;
            color: #fff;
            z-index: 200;
            display: none;
            box-shadow: 0 0 30px #ffe600;
            width: 85%;
            max-width: 380px;
        }

        .leaf {
            position: absolute;
            top: -20px;
            font-size: 20px;
            pointer-events: none;
            z-index: 99;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="creator-logo">
        <img src="./a.png" alt="Logo">
    </div>

    <button id="sound-toggle">🔊</button>
    <canvas id="game-canvas"></canvas>

    <div id="start-screen" class="screen active">
        <div class="start-content">
            <h1 class="game-title">ผจญภัยป่าเวทมนตร์<br><span style="font-size: 0.6em; color: #ffe600;">Math Adventure</span></h1>
            <button class="btn-start" onclick="startGame()">เริ่มเล่น 🎮</button>
        </div>
    </div>

    <div id="game-hud" style="display: none;">
        <div class="hud-box" id="hud-level">ด่านที่: 1</div>
        <div class="hud-box" id="hud-timer">⏳ 02:00</div>
        <div class="hud-box" id="hud-lives">❤️❤️❤️</div>
    </div>

    <div id="question-panel">
        <div id="question-text">โจทย์กำลังโหลด...</div>
    </div>

    <!-- หลอดแสดงพลังชีวิตของฝั่งผู้เล่นและศัตรูในด่านที่ 6 -->
    <div id="boss-hp-bar-container">
        <div class="hp-row">
            <span>👩‍🌾 ผู้เล่น:</span>
            <div class="hp-bar-bg">
                <div id="player-hp-fill" class="hp-bar-fill"></div>
            </div>
            <span id="player-hp-text">10/10</span>
        </div>
        <div class="hp-row">
            <span>🦹 วายร้าย:</span>
            <div class="hp-bar-bg">
                <div id="villain-hp-fill" class="hp-bar-fill"></div>
            </div>
            <span id="villain-hp-text">15/15</span>
        </div>
    </div>

    <!-- ปุ่มยิงฝั่งซ้ายของจอสำหรับด่าน 6 -->
    <div id="shoot-controls">
        <button class="btn-shoot" id="btn-shoot-single">ยิงทีละนัด 🔥</button>
        <button class="btn-shoot" id="btn-shoot-burst">ยิงแบบรัว 💣</button>
    </div>

    <div id="baskets-overlay" style="display: none;"></div>

    <div id="bottom-controls" style="display: none;">
        <div class="action-group" id="item-actions">
            <button class="btn-action" id="btn-put">ใส่ตะกร้า 🧺</button>
            <button class="btn-action btn-take-basket" id="btn-take">หยิบออก 🧺↩️</button>
            <button class="btn-action" id="btn-drop">โยนทิ้ง 🍃</button>
        </div>

        <div class="action-group" id="answer-actions">
            <div class="choices-container" id="choices-box"></div>
            <button class="btn-action btn-flag" id="btn-submit">🚩</button>
        </div>

        <div id="dpad">
            <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
            <div class="dbtn" id="btn-left">◀</div><div></div><div class="dbtn" id="btn-right">▶</div>
            <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
        </div>
    </div>

    <div id="result-modal">
        <h2 id="modal-title" style="font-size: 2.5rem; margin-bottom: 10px;">❌</h2>
        <p id="modal-desc" style="font-size: 1.2rem; margin-bottom: 20px;">ลองใหม่อีกครั้ง</p>
        <button class="btn-start" id="modal-btn" style="font-size: 1.2rem; padding: 8px 25px;" onclick="closeModal()">ตกลง 👌</button>
    </div>
</div>

<script>
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.muted = false;
            this.bgmTimer = null;
            this.bgmNoteIndex = 0;
            this.bgmMelody = [
                { f: 523.25, d: 0.18, t: 'triangle' },
                { f: 659.25, d: 0.18, t: 'triangle' },
                { f: 783.99, d: 0.18, t: 'triangle' },
                { f: 1046.50, d: 0.25, t: 'square' },
                { f: 783.99, d: 0.18, t: 'triangle' },
                { f: 1046.50, d: 0.35, t: 'square' },
                
                { f: 587.33, d: 0.18, t: 'triangle' },
                { f: 698.46, d: 0.18, t: 'triangle' },
                { f: 880.00, d: 0.18, t: 'triangle' },
                { f: 1174.66, d: 0.25, t: 'square' },
                { f: 880.00, d: 0.18, t: 'triangle' },
                { f: 1174.66, d: 0.35, t: 'square' },

                { f: 659.25, d: 0.18, t: 'triangle' },
                { f: 783.99, d: 0.18, t: 'triangle' },
                { f: 987.77, d: 0.18, t: 'triangle' },
                { f: 1318.51, d: 0.25, t: 'square' },
                { f: 1174.66, d: 0.18, t: 'square' },
                { f: 1046.50, d: 0.35, t: 'square' }
            ];
        }

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            this.startBGM();
        }

        startBGM() {
            if (this.bgmTimer) return;
            const playNextBgmNote = () => {
                if (!this.muted && this.ctx) {
                    const note = this.bgmMelody[this.bgmNoteIndex];
                    if (note.f > 0) {
                        try {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            
                            osc.type = note.t || 'triangle';
                            osc.frequency.setValueAtTime(note.f, this.ctx.currentTime);
                            
                            gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + note.d);

                            osc.connect(gain);
                            gain.connect(this.ctx.destination);

                            osc.start();
                            osc.stop(this.ctx.currentTime + note.d);
                        } catch(e){}
                    }
                    this.bgmNoteIndex = (this.bgmNoteIndex + 1) % this.bgmMelody.length;
                    this.bgmTimer = setTimeout(playNextBgmNote, 220);
                } else {
                    this.bgmTimer = setTimeout(playNextBgmNote, 400);
                }
            };
            playNextBgmNote();
        }

        playTone(freq, type, duration) {
            if (this.muted || !this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch(e){}
        }

        playCorrect() {
            this.playTone(523.25, 'sine', 0.15);
            setTimeout(() => this.playTone(659.25, 'sine', 0.15), 150);
            setTimeout(() => this.playTone(783.99, 'sine', 0.3), 300);
        }

        playWrong() {
            this.playTone(200, 'sawtooth', 0.2);
            setTimeout(() => this.playTone(150, 'sawtooth', 0.3), 200);
        }

        playClick() {
            this.playTone(400, 'triangle', 0.05);
        }

        playThrow() {
            this.playTone(300, 'sine', 0.1);
            setTimeout(() => this.playTone(150, 'sine', 0.15), 100);
        }

        playFireball() {
            this.playTone(180, 'sawtooth', 0.15);
        }

        playTimeBonus() {
            this.playTone(523.25, 'sine', 0.1);
            setTimeout(() => this.playTone(659.25, 'sine', 0.1), 100);
            setTimeout(() => this.playTone(783.99, 'sine', 0.1), 200);
            setTimeout(() => this.playTone(1046.50, 'sine', 0.25), 300);
        }
    }

    const audio = new SoundEngine();
    document.getElementById('sound-toggle').addEventListener('click', () => {
        audio.init();
        audio.muted = !audio.muted;
        document.getElementById('sound-toggle').innerText = audio.muted ? '🔇' : '🔊';
    });

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const bgStart = new Image(); 
    bgStart.src = './a2.jpeg';

    let currentMode = 'START';
    let currentLevel = 1;
    let lives = 3;
    let timer = 120;
    let timerInterval = null;
    let villainShootInterval = null;
    let selectedCountChoice = null;

    const camera = {
        x: 0,
        y: 0,
        zoom: 1.2
    };

    const WORLD_WIDTH = 1400;
    const WORLD_HEIGHT = 1000;

    const player = {
        x: 200,
        y: 800,
        size: 45,
        speed: 5,
        heldItem: null,
        hp: 10,
        maxHp: 10
    };

    const villain = {
        x: 600,
        y: 400,
        size: 45,
        vx: 3,
        vy: 3,
        active: false,
        hp: 15,
        maxHp: 15
    };

    const keys = {};

    const ITEM_EMOJI_POOL = [
        { emoji: '🍄', name: 'เห็ด' },
        { emoji: '🍎', name: 'แอปเปิ้ล' },
        { emoji: '🥕', name: 'แครอท' },
        { emoji: '🌽', name: 'ข้าวโพด' },
        { emoji: '🍓', name: 'สตรอว์เบอร์รี' },
        { emoji: '🍇', name: 'องุ่น' },
        { emoji: '🌸', name: 'ดอกไม้' },
        { emoji: '💎', name: 'อัญมณี' },
        { emoji: '🌰', name: 'ลูกเกาลัด' },
        { emoji: '🍊', name: 'ส้ม' }
    ];

    let currentQuestion = null;
    let itemsOnGround = [];
    let thrownItems = [];
    let fireballs = [];
    let playerFireballs = [];
    let baskets = [];

    function resizeCanvas() {
        const container = document.getElementById('game-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startGame() {
        audio.init();
        audio.playClick();
        document.getElementById('start-screen').classList.remove('active');
        
        document.getElementById('bottom-controls').style.display = 'flex';
        currentLevel = 1;
        lives = 3;
        document.getElementById('hud-lives').innerText = '❤️❤️❤️';
        
        enterLevel(currentLevel);
        requestAnimationFrame(gameLoop);
    }

    function generateDynamicQuestion(levelNum) {
        if (levelNum === 6) {
            return {
                id: 6,
                text: `ด่านสุดท้าย ⚔️: ลานประลองพื้นที่โล่ง! ไล่ยิงวายร้ายให้พลังชีวิตหมด!`,
                basketsNeeded: 0,
                perBasket: 0,
                totalTarget: 0,
                targetEmoji: ''
            };
        }

        const countType = Math.random() > 0.5 ? 2 : 5;
        const basketCount = Math.floor(Math.random() * 3) + 2;
        const targetObj = ITEM_EMOJI_POOL[Math.floor(Math.random() * ITEM_EMOJI_POOL.length)];

        return {
            id: levelNum,
            text: `เก็บ${targetObj.name} ${targetObj.emoji} ใส่ตะกร้า ${basketCount} ใบ ใบละ ${countType} ชิ้น (นับทีละ ${countType})`,
            basketsNeeded: basketCount,
            perBasket: countType,
            totalTarget: basketCount * countType,
            targetEmoji: targetObj.emoji
        };
    }

    function renderBasketsUI() {
        const overlay = document.getElementById('baskets-overlay');
        overlay.innerHTML = '';
        baskets.forEach((b, idx) => {
            const bDiv = document.createElement('div');
            bDiv.className = 'basket-item-ui';
            bDiv.innerHTML = `
                <div class="basket-title">ใบที่ ${idx + 1}</div>
                <div class="basket-icon">🧺</div>
                <div class="basket-contents">${b.items.join('')}</div>
            `;
            overlay.appendChild(bDiv);
        });
    }

    function updateTimerUI() {
        const mins = String(Math.floor(timer / 60)).padStart(2, '0');
        const secs = String(timer % 60).padStart(2, '0');
        document.getElementById('hud-timer').innerText = `⏳ ${mins}:${secs}`;
    }

    function updateHpUI() {
        const pPct = Math.max(0, (player.hp / player.maxHp) * 100);
        const vPct = Math.max(0, (villain.hp / villain.maxHp) * 100);
        
        document.getElementById('player-hp-fill').style.width = pPct + '%';
        document.getElementById('player-hp-text').innerText = `${player.hp}/${player.maxHp}`;

        document.getElementById('villain-hp-fill').style.width = vPct + '%';
        document.getElementById('villain-hp-text').innerText = `${villain.hp}/${villain.maxHp}`;
    }

    function shootFireballs() {
        if (!villain.active || currentMode !== 'GAME') return;
        
        const count = currentLevel === 6 ? Math.floor(Math.random() * 2) + 2 : Math.floor(Math.random() * 3) + 1;
        audio.playFireball();

        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 4 + Math.random() * 3;
            
            fireballs.push({
                x: villain.x,
                y: villain.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: 28
            });
        }
    }

    function playerShootSingle() {
        if (currentLevel !== 6 || currentMode !== 'GAME') return;
        audio.playFireball();
        
        const dx = villain.x - player.x;
        const dy = villain.y - player.y;
        const angle = Math.atan2(dy, dx);
        const speed = 8;

        playerFireballs.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 26
        });
    }

    function playerShootBurst() {
        if (currentLevel !== 6 || currentMode !== 'GAME') return;
        
        let count = 0;
        const burstInterval = setInterval(() => {
            if (count >= 3 || currentMode !== 'GAME') {
                clearInterval(burstInterval);
                return;
            }
            playerShootSingle();
            count++;
        }, 120);
    }

    function enterLevel(levelNum) {
        currentLevel = levelNum;
        currentMode = 'GAME';
        
        document.getElementById('game-hud').style.display = 'flex';
        document.getElementById('hud-level').innerText = `ด่านที่: ${currentLevel}`;
        
        const shootControls = document.getElementById('shoot-controls');
        const bossHpBar = document.getElementById('boss-hp-bar-container');
        const itemActions = document.getElementById('item-actions');
        const answerActions = document.getElementById('answer-actions');
        const questionPanel = document.getElementById('question-panel');
        const basketsOverlay = document.getElementById('baskets-overlay');

        if (currentLevel === 6) {
            shootControls.style.display = 'flex';
            bossHpBar.style.display = 'flex';
            itemActions.style.display = 'none';
            answerActions.style.display = 'none';
            basketsOverlay.style.display = 'none';
            questionPanel.style.display = 'block';
            
            player.hp = 10;
            player.maxHp = 10;
            villain.hp = 15;
            villain.maxHp = 15;
            updateHpUI();
        } else {
            shootControls.style.display = 'none';
            bossHpBar.style.display = 'none';
            itemActions.style.display = 'flex';
            answerActions.style.display = 'flex';
            basketsOverlay.style.display = 'flex';
            questionPanel.style.display = 'block';
        }

        currentQuestion = generateDynamicQuestion(currentLevel);
        document.getElementById('question-text').innerText = currentQuestion.text;

        if (currentLevel < 6) {
            const correctVal = currentQuestion.totalTarget;
            const wrongVal = correctVal + (Math.random() > 0.5 ? currentQuestion.perBasket : -currentQuestion.perBasket);
            const choices = [correctVal, wrongVal > 0 ? wrongVal : correctVal + 2].sort(() => Math.random() - 0.5);
            
            const choicesBox = document.getElementById('choices-box');
            choicesBox.innerHTML = '';
            selectedCountChoice = null;

            choices.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'btn-choice';
                btn.innerText = `รวม ${val}`;
                btn.onclick = () => {
                    audio.playClick();
                    document.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedCountChoice = val;
                };
                choicesBox.appendChild(btn);
            });

            baskets = [];
            const bCount = currentQuestion.basketsNeeded;
            for(let i=0; i<bCount; i++) {
                baskets.push({
                    id: i+1,
                    items: []
                });
            }
            renderBasketsUI();
        }

        player.x = 200;
        player.y = WORLD_HEIGHT - 200;
        player.heldItem = null;

        itemsOnGround = [];
        thrownItems = [];
        fireballs = [];
        playerFireballs = [];

        // ด่านที่ 6 ไม่มีผลไม้/ไอเทมบนพื้น
        if (currentLevel < 6) {
            for(let i=0; i < currentQuestion.totalTarget + 2; i++) {
                itemsOnGround.push({
                    id: 'target_' + i,
                    emoji: currentQuestion.targetEmoji,
                    x: 200 + Math.random() * (WORLD_WIDTH - 400),
                    y: 200 + Math.random() * (WORLD_HEIGHT - 450),
                    size: 35
                });
            }

            const distractors = ITEM_EMOJI_POOL.filter(item => item.emoji !== currentQuestion.targetEmoji);
            for(let i=0; i<18; i++) {
                const distObj = distractors[Math.floor(Math.random() * distractors.length)];
                itemsOnGround.push({
                    id: 'dist_' + i,
                    emoji: distObj.emoji,
                    x: 200 + Math.random() * (WORLD_WIDTH - 400),
                    y: 200 + Math.random() * (WORLD_HEIGHT - 450),
                    size: 35
                });
            }

            if (currentLevel >= 1 && currentLevel <= 5) {
                itemsOnGround.push({
                    id: 'time_bonus',
                    emoji: '⏳',
                    isTimeBonus: true,
                    x: 200 + Math.random() * (WORLD_WIDTH - 400),
                    y: 200 + Math.random() * (WORLD_HEIGHT - 450),
                    size: 38
                });
            }
        }

        villain.x = WORLD_WIDTH / 2;
        villain.y = 300;
        villain.active = true;

        clearInterval(villainShootInterval);
        villainShootInterval = setInterval(shootFireballs, currentLevel === 6 ? 2500 : 5000);

        timer = 120;
        updateTimerUI();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timer--;
            updateTimerUI();
            if (timer <= 0) {
                handlePlayerDeath();
            }
        }, 1000);
    }

    function checkItemPickup() {
        if (currentLevel === 6) return;
        
        for(let i = itemsOnGround.length - 1; i >= 0; i--) {
            const it = itemsOnGround[i];
            const dist = Math.hypot(player.x - it.x, player.y - it.y);
            if (dist < player.size) {
                if (it.isTimeBonus) {
                    timer += 30;
                    audio.playTimeBonus();
                    updateTimerUI();
                    itemsOnGround.splice(i, 1);
                    break;
                } 
                else if (!player.heldItem) {
                    player.heldItem = it.emoji;
                    itemsOnGround.splice(i, 1);
                    audio.playClick();
                    break;
                }
            }
        }
    }

    function putInBasket() {
        if (!player.heldItem || currentLevel === 6) return;
        
        for(let b of baskets) {
            if (b.items.length < currentQuestion.perBasket) {
                b.items.push(player.heldItem);
                player.heldItem = null;
                audio.playClick();
                renderBasketsUI();
                return;
            }
        }

        if (baskets.length > 0) {
            baskets[baskets.length - 1].items.push(player.heldItem);
            player.heldItem = null;
            audio.playClick();
            renderBasketsUI();
        }
    }

    function takeFromBasket() {
        if (player.heldItem || currentLevel === 6) return;
        
        for (let i = baskets.length - 1; i >= 0; i--) {
            if (baskets[i].items.length > 0) {
                player.heldItem = baskets[i].items.pop();
                audio.playClick();
                renderBasketsUI();
                return;
            }
        }
    }

    function dropItem() {
        if (player.heldItem && currentLevel < 6) {
            audio.playThrow();
            const angle = Math.random() * Math.PI * 2;
            const force = 8 + Math.random() * 4;
            
            thrownItems.push({
                emoji: player.heldItem,
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * force,
                vy: Math.sin(angle) * force - 3,
                size: 35
            });

            player.heldItem = null;
        }
    }

    function updateThrownItems() {
        for(let i=thrownItems.length-1; i>=0; i--) {
            const item = thrownItems[i];
            item.x += item.vx;
            item.y += item.vy;
            item.vx *= 0.92;
            item.vy *= 0.92;

            if (Math.hypot(item.vx, item.vy) < 0.5) {
                itemsOnGround.push({
                    id: Date.now() + Math.random(),
                    emoji: item.emoji,
                    x: Math.max(50, Math.min(WORLD_WIDTH - 50, item.x)),
                    y: Math.max(50, Math.min(WORLD_HEIGHT - 50, item.y)),
                    size: item.size
                });
                thrownItems.splice(i, 1);
            }
        }
    }

    function updateFireballs() {
        // ลูกไฟของวายร้าย
        for (let i = fireballs.length - 1; i >= 0; i--) {
            const fb = fireballs[i];
            fb.x += fb.vx;
            fb.y += fb.vy;

            const dist = Math.hypot(player.x - fb.x, player.y - fb.y);
            if (dist < (player.size / 2 + fb.size / 3)) {
                fireballs.splice(i, 1);
                
                if (currentLevel === 6) {
                    player.hp--;
                    audio.playWrong();
                    updateHpUI();
                    if (player.hp <= 0) {
                        handlePlayerDeath();
                        return;
                    }
                } else {
                    handlePlayerDeath();
                    return;
                }
            }

            if (fb.x < -50 || fb.x > WORLD_WIDTH + 50 || fb.y < -50 || fb.y > WORLD_HEIGHT + 50) {
                fireballs.splice(i, 1);
            }
        }

        // ลูกไฟของผู้เล่น (ด่าน 6)
        for (let i = playerFireballs.length - 1; i >= 0; i--) {
            const pfb = playerFireballs[i];
            pfb.x += pfb.vx;
            pfb.y += pfb.vy;

            if (villain.active) {
                const distV = Math.hypot(villain.x - pfb.x, villain.y - pfb.y);
                if (distV < (villain.size / 2 + pfb.size / 2)) {
                    playerFireballs.splice(i, 1);
                    villain.hp--;
                    audio.playClick();
                    updateHpUI();
                    
                    if (villain.hp <= 0) {
                        villain.active = false;
                        audio.playCorrect();
                        clearInterval(villainShootInterval);
                        clearInterval(timerInterval);
                        
                        showModal("🏆", "คุณพิชิตวายร้าย และผ่านครบทั้ง 6 ด่านแล้ว!", () => {
                            resetToStartScreen();
                        }, "เริ่มเล่นอีกครั้ง 🔄");
                    }
                    continue;
                }
            }

            if (pfb.x < -50 || pfb.x > WORLD_WIDTH + 50 || pfb.y < -50 || pfb.y > WORLD_HEIGHT + 50) {
                playerFireballs.splice(i, 1);
            }
        }
    }

    function submitAnswer() {
        if (currentLevel === 6) return;

        if (selectedCountChoice === null) {
            alert("กรุณาเลือกคำตอบจำนวนรวมฝั่งขวาก่อนส่งครับ!");
            return;
        }

        let totalInBaskets = 0;
        let correctType = true;

        baskets.forEach(b => {
            totalInBaskets += b.items.length;
            b.items.forEach(emoji => {
                if (emoji !== currentQuestion.targetEmoji) correctType = false;
            });
        });

        if (totalInBaskets === currentQuestion.totalTarget && 
            selectedCountChoice === currentQuestion.totalTarget && correctType) {
            
            audio.playCorrect();
            showModal("🎉", `ผ่านด่านที่ ${currentLevel} แล้ว!`, () => {
                currentLevel++;
                enterLevel(currentLevel);
            });
        } else {
            audio.playWrong();
            handlePlayerDeath();
        }
    }

    function handlePlayerDeath() {
        clearInterval(villainShootInterval);
        lives--;
        let hearts = '';
        for(let i=0; i<3; i++) hearts += (i < lives) ? '❤️' : '🖤';
        document.getElementById('hud-lives').innerText = hearts;

        if (lives <= 0) {
            showModal("❌", "คุณแพ้แล้ว (ชีวิตหมด)", () => {
                resetToStartScreen();
            }, "เริ่มเล่นอีกครั้ง 🔄");
        } else {
            showModal("❌", "ลองใหม่อีกครั้ง", () => {
                enterLevel(currentLevel);
            });
        }
    }

    function resetToStartScreen() {
        clearInterval(timerInterval);
        clearInterval(villainShootInterval);
        currentMode = 'START';
        document.getElementById('question-panel').style.display = 'none';
        document.getElementById('boss-hp-bar-container').style.display = 'none';
        document.getElementById('baskets-overlay').style.display = 'none';
        document.getElementById('game-hud').style.display = 'none';
        document.getElementById('bottom-controls').style.display = 'none';
        document.getElementById('shoot-controls').style.display = 'none';
        document.getElementById('start-screen').classList.add('active');
    }

    function showModal(title, desc, onOk, btnText = "ตกลง 👌") {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        const btn = document.getElementById('modal-btn');
        btn.innerText = btnText;
        document.getElementById('result-modal').style.display = 'block';
        window.modalOkCallback = onOk;
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
        if (window.modalOkCallback) window.modalOkCallback();
    }

    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        if (e.key === 'r' || e.key === 'R') takeFromBasket();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    const setupTouchBtn = (id, actionStart, actionEnd) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        
        const handleStart = (e) => {
            e.preventDefault();
            audio.init();
            if (actionStart) actionStart();
        };

        const handleEnd = (e) => {
            e.preventDefault();
            if (actionEnd) actionEnd();
        };

        btn.addEventListener('touchstart', handleStart, { passive: false });
        btn.addEventListener('touchend', handleEnd, { passive: false });
        btn.addEventListener('mousedown', handleStart);
        btn.addEventListener('mouseup', handleEnd);
    };

    setupTouchBtn('btn-up', () => keys['ArrowUp'] = true, () => keys['ArrowUp'] = false);
    setupTouchBtn('btn-down', () => keys['ArrowDown'] = true, () => keys['ArrowDown'] = false);
    setupTouchBtn('btn-left', () => keys['ArrowLeft'] = true, () => keys['ArrowLeft'] = false);
    setupTouchBtn('btn-right', () => keys['ArrowRight'] = true, () => keys['ArrowRight'] = false);

    setupTouchBtn('btn-put', () => putInBasket());
    setupTouchBtn('btn-take', () => takeFromBasket());
    setupTouchBtn('btn-drop', () => dropItem());
    setupTouchBtn('btn-submit', () => submitAnswer());

    setupTouchBtn('btn-shoot-single', () => playerShootSingle());
    setupTouchBtn('btn-shoot-burst', () => playerShootBurst());

    function updateMovement() {
        if (currentMode !== 'GAME') return;

        let dx = 0, dy = 0;
        if (keys['ArrowUp'] || keys['w']) dy -= player.speed;
        if (keys['ArrowDown'] || keys['s']) dy += player.speed;
        if (keys['ArrowLeft'] || keys['a']) dx -= player.speed;
        if (keys['ArrowRight'] || keys['d']) dx += player.speed;

        player.x = Math.max(30, Math.min(WORLD_WIDTH - 30, player.x + dx));
        player.y = Math.max(30, Math.min(WORLD_HEIGHT - 30, player.y + dy));

        camera.x = player.x - (canvas.width / (2 * camera.zoom));
        camera.y = player.y - (canvas.height / (2 * camera.zoom));

        camera.x = Math.max(0, Math.min(WORLD_WIDTH - (canvas.width / camera.zoom), camera.x));
        camera.y = Math.max(0, Math.min(WORLD_HEIGHT - (canvas.height / camera.zoom), camera.y));

        checkItemPickup();
        updateThrownItems();
        updateFireballs();

        if (villain.active) {
            villain.x += villain.vx;
            villain.y += villain.vy;
            if (villain.x < 50 || villain.x > WORLD_WIDTH - 50) villain.vx *= -1;
            if (villain.y < 120 || villain.y > WORLD_HEIGHT - 180) villain.vy *= -1;

            const distV = Math.hypot(player.x - villain.x, player.y - villain.y);
            if (distV < player.size) {
                if (currentLevel === 6) {
                    player.hp -= 0.05; // ด่าน 6 ชนตัววายร้ายเลือดค่อยๆ ลด
                    updateHpUI();
                    if (player.hp <= 0) handlePlayerDeath();
                } else {
                    handlePlayerDeath();
                }
            }
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (currentMode === 'GAME') {
            ctx.save();
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            if (bgStart.complete && bgStart.naturalWidth !== 0) {
                ctx.drawImage(bgStart, 0, 0, WORLD_WIDTH, WORLD_HEIGHT);
            } else {
                const grad = ctx.createLinearGradient(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
                grad.addColorStop(0, '#1e3d2f');
                grad.addColorStop(1, '#0a1a12');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
            }

            itemsOnGround.forEach(it => {
                ctx.font = `${it.size}px serif`;
                ctx.textAlign = 'center';
                ctx.fillText(it.emoji, it.x, it.y);
            });

            thrownItems.forEach(it => {
                ctx.font = `${it.size}px serif`;
                ctx.textAlign = 'center';
                ctx.fillText(it.emoji, it.x, it.y);
            });

            fireballs.forEach(fb => {
                ctx.font = `${fb.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🔥', fb.x, fb.y);
            });

            playerFireballs.forEach(pfb => {
                ctx.font = `${pfb.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💥', pfb.x, pfb.y);
            });

            if (villain.active) {
                ctx.font = `${villain.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🦹', villain.x, villain.y);
            }

            ctx.font = `${player.size}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👩‍🌾', player.x, player.y);

            if (player.heldItem) {
                ctx.font = '22px serif';
                ctx.fillText(player.heldItem, player.x + 18, player.y - 25);
            }

            ctx.restore();
        }
    }

    function gameLoop() {
        updateMovement();
        render();
        requestAnimationFrame(gameLoop);
    }

    setInterval(() => {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.innerText = '🍃';
        leaf.style.left = Math.random() * 100 + 'vw';
        leaf.style.animationDuration = (3 + Math.random() * 5) + 's';
        document.body.appendChild(leaf);
        setTimeout(() => leaf.remove(), 8000);
    }, 1500);

</script>
</body>
</html>
